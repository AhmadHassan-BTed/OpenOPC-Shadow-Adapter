[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openopc-shadow-adapter"
version = "0.1.0"
description = "Human-in-the-Loop (HITL) execution adapter and React portal for the OpenOPC framework."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenOPC Shadow Team"},
]
keywords = [
    "openopc",
    "human-in-the-loop",
    "hitl",
    "multi-agent",
    "orchestration",
    "llm",
    "task-routing",
    "shadow-mode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
opc = [
    "opc>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "coverage>=7.0",
]
all = [
    "openopc-shadow-adapter[opc,dev]",
]

[project.scripts]
shadow-serve = "shadow_adapter.api.app:main"

[project.urls]
Homepage = "https://github.com/openopc/openopc-shadow-adapter"
Documentation = "https://github.com/openopc/openopc-shadow-adapter#readme"
Repository = "https://github.com/openopc/openopc-shadow-adapter"
Issues = "https://github.com/openopc/openopc-shadow-adapter/issues"

[tool.hatch.build.targets.wheel]
packages = ["shadow_adapter"]

[tool.hatch.build.targets.wheel.shared-data]
"shadow_adapter/frontend/dist" = "share/shadow_adapter/frontend/dist"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
