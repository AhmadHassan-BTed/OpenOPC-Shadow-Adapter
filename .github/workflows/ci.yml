name: OpenOPC Shadow Adapter — Automated Survival CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Matrix Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Compile React Human Portal SPA
        run: |
          cd shadow_adapter/frontend
          npm ci || npm install
          npm run build

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run Mock OpenOPC Engine Simulation
        run: |
          python tests/mock_openopc_engine.py
